function nj(s,w){const K='#0a0d18',D='#37425e',L='#5d6c94',S='#f7c78e',W='#fff',G='#4b5675',G2='#7684ad',Y='#f2b705',RD='#e53935',T='#7fe3ff',r=R;

else if(s=='wave')o+=dn(6)+r(19,16,6,2,D)+up(24,'25px 17px');

else o+=r(9,8,3,3,K)+r(16,8,3,3,K)+r(10,8,1,1,W)+r(17,8,1,1,W)+r(9,10,1,1,'#2b2f3d')+r(16,10,1,1,'#2b2f3d');
return `<div class="nj ${s}" style="width:${w}px"><svg viewBox="-2 0 32 26" style="overflow:visible">${o}</svg></div>`}
function card(c,rev){const web=!!c.url,l=(c.from||'').replace(/[^A-Za-z]/g,'')[0]||'?';
return `<div class="card ${c.ok?'good':'bad'} ${rev?'rev':''}">`+(web?`<div class="url">${M(c.url)}</div><b style="color:#4285f4">${E(c.logo||'')}</b>`:`<div class="hd"><span class="av">${l}</span><div>From ${M(c.from)}</div></div>`)+`<h3>${M(c.sub)}</h3><p>${M(c.body)}</p>`+(c.fields||[]).map(f=>`<div class="in">${E(f)}</div>`).join('')+(c.att?`<span class="chip">📎 ${E(c.att)}</span>`:'')+(c.btn?`<span class="cb">${M(c.btn)}</span>`:'')+`</div>`}
const lb=()=>ld('cn_lb')||{};
function prog(){return `<div class="prog">`+S.deck.map((_,i)=>`<span class="${i<S.res.length?(S.res[i]?'ok':'no'):i==S.i?'cur':''}">${i<S.res.length||i==S.i?'✦':'<b>✦</b>'}</span>`).join('')+`</div>`}
const tiers=[[50,'CYBER NINJA (winner!)'],[40,'SHARP EYE'],[30,'GETTING THERE'],[0,'ROOKIE']];
function render(){let h='',a=$('app');
if(S.scr=='intro')h=`<div class="sm" id="tt">CYBER AWARENESS MONTH</div><h1 style="margin-top:6px">CYBER<br>NINJA</h1>${nj('wave',150)}<div class="sm">SPOT THE ATTACK</div><button class="btn blue" data-a="start">START</button><button class="btn org" data-a="board">LEADERBOARD</button><div class="track"><div class="nj run" style="width:44px">${nj('idle',44).replace(/^<div[^>]*>|<\/div>$/g,'')}</div><span class="star">✦</span></div>`;
if(S.scr=='clan')h=`<div class="sm" style="color:var(--yel)">01 / THE CLAN</div><h2>CHOOSE YOUR CLAN</h2><div class="grid">${cfg.depts.map(d=>`<button class="opt ${S.dept==d?'on':''}" data-a="pick" data-v="${E(d)}">${E(d)}</button>`).join('')}</div><button class="btn org" data-a="go" ${S.dept?'':'disabled'}>CONTINUE</button>`;

if(!r)h+=`<button class="btn grn" data-a="ans" data-v="real">REAL</button><button class="btn rd" data-a="ans" data-v="atk">ATTACK</button>`;
else h+=`<div class="v ${r.right?'g':'r'}">${r.right?'NICE SLICE! +10':'OUCH! It was '+(c.ok?'REAL':'an ATTACK')}</div><div class="panel"><div class="sm" style="color:var(--yel)">${c.ok?'✔ WHY IT’S SAFE':'⚑ RED FLAGS'}</div><ul class="fl">${c.why.map(w=>`<li>${E(w)}</li>`).join('')}</ul></div><button class="btn yel" data-a="next">${S.i+1<S.deck.length?'NEXT MISSION':'FINISH'}</button>`}
if(S.scr=='end'){const sc=S.score,t=tiers.find(t=>sc>=t[0]);

if(S.scr=='board'){const L=lb(),rows=cfg.depts.map(d=>[d,L[d]||0]).sort((a,b)=>b[1]-a[1]);

if(S.scr=='admin'){const L=lb();h=`<h2>ADMIN</h2><div class="sm">DELETE SCORES</div><div class="lb">${cfg.depts.map(d=>`<div class="lr"><div class="nm">${E(d)}</div><span class="pt">${L[d]||0}</span><button class="mini" data-a="del" data-v="${E(d)}">${S.cf==d?'SURE?':'DELETE'}</button></div>`).join('')}</div><button class="btn rd" data-a="delall">${S.cf=='*'?'TAP AGAIN TO CLEAR':'CLEAR ALL SCORES'}</button><button class="btn blue" data-a="edit">EDIT CARDS &amp; DEPARTMENTS</button><button class="btn yel" data-a="exit">EXIT ADMIN</button>`}
a.innerHTML=h;window.scrollTo(0,0)}
function act(a,v){
if(a=='start'){S.scr='clan';S.dept=null}
else if(a=='board'){S.last=S.scr=='end';S.scr='board'}
else if(a=='pick')S.dept=v;
else if(a=='go'){S.deck=[...cfg.cards].sort(()=>Math.random()-.5).slice(0,5);Object.assign(S,{i:0,score:0,res:[],ans:null,scr:'play'})}
else if(a=='ans'){const right=(v=='real')==S.deck[S.i].ok;S.ans={right};S.res.push(right);if(right)S.score+=10}
else if(a=='next'){if(S.i+1<S.deck.length){S.i++;S.ans=null}else{const L=lb();L[S.dept]=(L[S.dept]||0)+S.score;sv('cn_lb',L);S.scr='end'}}
else if(a=='del'){if(S.cf!=v)S.cf=v;else{const L=lb();delete L[v];sv('cn_lb',L);S.cf=null}}
else if(a=='delall'){if(S.cf!='*')S.cf='*';else{sv('cn_lb',{});S.cf=null}}
else if(a=='edit'){$('ta').value=JSON.stringify(cfg,null,1);$('ed').style.display='flex';return}
else if(a=='exit'){S.scr='intro';S.cf=null}
else if(a=='again'){S.scr='intro';S.last=false}
else if(a=='save'){try{const j=JSON.parse($('ta').value);if(!Array.isArray(j.depts)||!Array.isArray(j.cards))throw 0;cfg=j;sv('cn_cfg',j);$('msg').textContent='Saved.'}catch(e){$('msg').textContent='Invalid format — not saved.'}return}
else if(a=='reset'){cfg=DEF;sv('cn_cfg',DEF);$('ta').value=JSON.stringify(cfg,null,1);$('msg').textContent='Content reset.';return}
else if(a=='clr'){if(++clr<2){$('msg').textContent='Tap again to clear all scores.';return}clr=0;sv('cn_lb',{});$('msg').textContent='Leaderboard cleared.';return}
else if(a=='close'){$('ed').style.display='none';S.scr='admin';clr=0}
render()}
document.addEventListener('click',e=>{if(e.target.id=='tt'){if(++taps>=5){taps=0;S.scr='admin';render()}return}
const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.v)});
